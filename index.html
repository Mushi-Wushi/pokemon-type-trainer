<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Pokémon Type Matchup Trainer</title>
   <link rel="stylesheet" href="style.css" />
</head>
<body>
   <main class="app" aria-live="polite">
      <header class="app__header">
         <h1>Pokémon Type Matchup Trainer</h1>
         <p class="subtitle">Pick the type that is super effective.</p>
      </header>

      <!-- Start Screen -->
       <section id="start-screen" class="card">
         <h2>Ready to train?</h2>
         <p>You will answer 10 questions about type effectiveness.</p>
         <button id="start-btn" class="btn btn--primary">Start Quiz</button>
       </section>

       <!-- Quiz Screen -->
       <section id="quiz-screen" class="card hidden">
         <div class="meta">
            <p><strong>Questions:</strong> <span id="question-number">1</span>/10</p>
            <p><strong>Score:</strong> <span id="score">0</span></p>
         </div>
         
         <h2 id="question-text">Which type is super effective against ... ?</h2>

         <div id="options" class="options" role="group" aria-label="Answer choices">
            <!-- buttons inserted by JS-->
         </div>
         
         <p id="feedback" class="feedback" aria-live="assertive"></p>

         <div class="actions">
            <button id="next-btn" class="btn" disabled>Next Question</button>
         </div>
       </section>

       <!-- Result Screen -->
        <section id="result-screen" class="card hidden">
         <h2>Quiz Complete</h2>
         <p id="final-score">You score 0 out of 10.</p>
         <button id="restart-btn" class="btn btn--primary">Play Again</button>
        </section>
   </main>

   <script type="module" src="script.js"></script>
</body>
</html>
